[workspace]
resolver = "3"
members = [
    "nub/nub",
    "nub/nub-kernel",
    "nub/nub-exec",
    "nub/nub-recompiler-x86",
    "nub/nub-arch-local",
    "nub/nub-arch-x86",
    "nub/nub-arch-x86-abi",
    "nub/nub-host-kvm",
    "nub/nub-host-common",
    "nub/nub-host-guest-macro",
    "nub/nub-build",
    "nub/nub-program",
    "nub/nub-linker",
    "nub/nub-rt",
    "nub/nub-rt-macro",
    "nub/nub-bench",
    "nub/programs/blake2b",
    "nub/programs/ecrecover",
    "nub/programs/ed25519",
    "nub/programs/fri-fold-tree",
    "nub/programs/goldilocks-mul",
    "nub/programs/goldilocks-poseidon2",
    "nub/programs/keccak",
    "nub/programs/mini-verifier",
    "nub/programs/poly-eval",
    "nub/programs/poseidon2-perm",
    "nub/programs/prime-sieve",
    "rust/build-crate",
]
exclude = [
    # Vendored guest-bin (`#![no_std]` with its own panic_handler +
    # global_allocator). Only consumed by `nub-arch-x86` on
    # the `cfg(target_os = "none")` cross-compile; excluding it from
    # the workspace prevents `cargo build --workspace` (host target)
    # from trying to link a no_std panic_impl into a std world.
    "nub/nub-arch-guestbin",
    # Multi-engine benchmark comparison. Its own workspace + Cargo.lock so
    # polkavm/wasmtime/wasmer (hundreds of crates) never enter this
    # lockfile, `cargo audit`, or the SBOM. It ships nothing; it only
    # measures. Build it with
    # `--manifest-path nub/bench-compare/Cargo.toml`.
    "nub/bench-compare",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = [ "Bitarray GmbH <legal@bitarray.dev>" ]

[workspace.dependencies]
proptest = "1"
thiserror = "2"
