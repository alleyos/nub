# Sync anchors for the two-way manual mirror with alleyos/alley.
# Read + updated by the procedures in README.md ("Mirror of
# alleyos/alley"). This file is repo-local: it never syncs.

[upstream]
# The monorepo this repository mirrors a subtree of.
repo = "github.com/alleyos/alley"
# The mirror boundary: the synced trees, used as the format-patch
# pathspec (trailing slash optional — git selects the same file set
# either way). Everything outside these paths is repo-local and
# never syncs in either direction.
paths = ["nub/", "rust/build-crate/"]

[state]
# Last alley master commit whose nub/ + rust/build-crate trees are
# fully reflected here. Updated by whoever completes a sync:
# jar → nub sets it to the jar master SHA just imported; nub → jar
# sets it to the alley merge commit of the exported PR.
jar-synced = "1a166411c8940dcecc8b4a473bed2c856694ea41"
# Last commit on this repo's master fully reflected in alley.
# Updated at the same moments: jar → nub sets it to the new local
# tip (the trees agree again after the import); nub → jar sets it
# to the local tip the merged PR exported. Initial value = the
# git-filter-repo extraction tip.
nub-synced = "c9cdf565cf5629d512d8431d67a387f96164370a"
